name: CI

# The README "Run it" checks, on every pull request and every push to main.
# build, server and browser-a run on separate runners; browser-b has eight matrix legs after build's dist/:
# flows-a, flows-b, flows-c, presentation, presentation-2, presentation-3, scene-life and scene-water.
# The four existing required browser-b names stay; checks gates the result of the entire matrix.
# Heavy scene proofs are isolated from UI proofs; #1034 tracks measured timing and full-green-run acceptance.
# browser-a is split three ways (a1, a2, a3) by measured step time, about 8-12 minutes each (the whole was ~29);
# the browser-a job itself only reports whether all three passed, because the ruleset requires that name.
# `checks` is the required merge check: it requires every job, including every browser-a and browser-b suite,
# except the advisory `loosen` job.
# Docs-only PRs (see changes job) skip the heavy steps but still report success so required checks stay green.
on:
  pull_request:
    # Drafts skip the suites; marking a PR ready starts its run.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A new push to a PR cancels that PR's older run, so stale commits stop holding runners. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE=$(git merge-base "origin/$BASE_REF" HEAD || true)
          if [ -z "$BASE" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LIST=$(git diff --no-renames --name-only "$BASE" HEAD)
          if [ -z "$LIST" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t CHANGED <<< "$LIST"
          DOCS_ONLY=true
          for file in "${CHANGED[@]}"; do
            # README.md is consumed by fortune-tray-prove, and AGENTS.md and CLAUDE.md are agent instructions, not docs (#923).
            # Other markdown, docs, issue templates, and LICENSE are docs-only.
            case "$file" in
              README.md|AGENTS.md|CLAUDE.md) DOCS_ONLY=false; break;;
              docs/*|.github/ISSUE_TEMPLATE/*|LICENSE|*.md)
                ;;
              *)
                DOCS_ONLY=false
                break
                ;;
            esac
          done
          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm ci
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm ci --prefix server
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run typecheck
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run build
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
      # #868: on a pull request, build the base commit the PR merges onto (main's tip) in a second worktree, so size-prove can
      # budget this PR's growth per chunk instead of one shared total. Pushes to main check the ceilings only.
      # The base is the checked-out merge commit's first parent: pull_request.base.sha can be an older main, which would
      # charge this PR with everything main gained since.
      - if: needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE_SHA=$(git cat-file -p HEAD | awk '/^parent /{print $2; exit}')
          echo "size base: $BASE_SHA (first parent of $(git rev-parse HEAD))"
          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          cd "$RUNNER_TEMP/base"
          npm ci
          npm run build
      - if: needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request'
        run: node scripts/size-prove.mjs --base "$RUNNER_TEMP/base"
      - if: needs.changes.outputs.docs_only != 'true' && github.event_name != 'pull_request'
        run: npm run size-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run size-delta-prove

  server:
    needs: changes
    runs-on: ubuntu-latest
    # dice-prove's sampling took 99 s on CI (#926, a349dbf); the whole job took under 6 minutes.
    timeout-minutes: 15
    steps:
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm ci
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm ci --prefix server
      # Before the suites, so it still reports when a test fails.
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run registered-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run spiral-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run wayfarer-modes-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run bot-harbor-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm test
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run profile-pin-queue-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run profile-unknown-cap-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run profile-reservation-recovery-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run profile-derive-error-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run profile-permissions-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run profile-socket-rate-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run profile-lock-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run profile-expiry-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run profile-pin-race-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run next-up-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run touch-place-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run stale-pr-sweeper-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run review-desk-inbox-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run ffmpeg-install-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run flake-rerun-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run soak-evidence-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run auto-merge-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run label-commands-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run dice-prove
      # #1073: measures every file in public/audio with ffmpeg.
      # #1186: the apt mirror sometimes hangs; bound each attempt, retry, and fail loudly if ffmpeg is still missing.
      - if: needs.changes.outputs.docs_only != 'true'
        timeout-minutes: 6
        run: |
          command -v ffmpeg >/dev/null || for attempt in 1 2 3; do
            sudo timeout 90 apt-get -o Acquire::Retries=3 update \
              && sudo timeout 150 apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg \
              && break
            echo "apt attempt $attempt failed"
            sleep 5
          done
          command -v ffmpeg
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run audio-level-prove
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run ambience-loop-prove

  # #924: advisory, so it is not in `checks.needs`. The desk reads it for REVIEWING.md item 4.
  # It diffs this PR's proofs against the commit it merges onto (the merge commit's first parent, as in build), using the
  # base's copy of loosen-prove so a PR cannot weaken the check that judges it.
  loosen:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          set -euo pipefail
          BASE_SHA=$(git cat-file -p HEAD | awk '/^parent /{print $2; exit}')
          git fetch --depth=1 origin "$BASE_SHA"
          if git cat-file -e "$BASE_SHA:scripts/loosen-prove.mjs" 2>/dev/null; then
            echo "Running the base's loosen-prove from $BASE_SHA."
            git show "$BASE_SHA:scripts/loosen-prove.mjs" > "$RUNNER_TEMP/loosen-prove.mjs"
            node "$RUNNER_TEMP/loosen-prove.mjs" --base "$BASE_SHA"
          else
            echo "The base $BASE_SHA has no scripts/loosen-prove.mjs yet, so this runs the PR's copy."
            node scripts/loosen-prove.mjs --base "$BASE_SHA"
          fi

  browser-a-suites:
    name: browser-a (${{ matrix.suite }})
    needs: changes
    runs-on: ubuntu-latest
    # The browser jobs run about 19-20 minutes on a busy runner; 20 cancelled them mid-proof.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [a1, a2, a3]
    steps:
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm ci
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm ci --prefix server
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: needs.changes.outputs.docs_only != 'true'
        run: npx playwright install --with-deps chromium
      # Give a new proof one suite's condition (the shortest: a3, then a1); without one it runs in all three.
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'a1'
        run: npm run client-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'a3'
        run: npm run dock-rates-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'a1'
        run: npm run dpr-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'a1'
        run: npm run hotseat-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'a2'
        run: npm run tabs-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'a3'
        run: npm run countdown-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'a3'
        run: npm run turn-extension-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'a3'
        run: npm run steal-picker-push-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'a3'
        run: npm run trade-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'a2'
        run: npm run practice-trade-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'a1'
        run: npm run hud-safe-area-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'a1'
        run: npm run connection-health-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'a3'
        run: npm run first-game-coach-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'a2'
        run: npm run render-recovery-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'a2'
        run: npm run webgl-recovery-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'a2'
        run: npm run rotate-overlays-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'a3'
        run: npm run fortune-count-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'a3'
        run: npm run fortune-tray-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'a3'
        run: npm run fortune-cue-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'a3'
        run: npm run lobby-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'a3'
        run: npm run my-numbers-prove
      # pages-prove rebuilds dist/ under /emberisle/; browser-a has no later dist/ reader.
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'a3'
        run: npm run pages-prove
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-prove-screenshot-${{ matrix.suite }}
          path: test-results/
          if-no-files-found: ignore

  # The ruleset requires a check named exactly "browser-a"; it passes only when all three suites pass.
  # A draft skips it (grey), like every other job; ready_for_review starts the run that must pass.
  browser-a:
    needs: browser-a-suites
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test '${{ needs.browser-a-suites.result }}' = success

  browser-b:
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Keep the four required leg names; checks also covers every added leg.
        suite: [flows-a, flows-b, presentation, presentation-2, flows-c, presentation-3, scene-life, scene-water]
    steps:
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm ci
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm ci --prefix server
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: needs.changes.outputs.docs_only != 'true'
        run: npx playwright install --with-deps chromium
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run hand-cards-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation-3'
        run: npm run hand-offer-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-c'
        run: npm run served-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation-3'
        run: npm run chunk-fail-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation'
        run: npm run restore-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run night-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-b'
        run: npm run chat-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run react-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-c'
        run: npm run wayfarer-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-c'
        run: npm run robber-hex-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-c'
        run: npm run robber-prompt-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation-2'
        run: npm run sounds-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation-2'
        run: npm run audio-recovery-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run sound-mixer-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run your-turn-cue-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation-2'
        run: npm run music-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run ore-tokens-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'scene-life'
        run: npm run climber-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-c'
        run: npm run tokens-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-c'
        run: npm run pieces-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-b'
        run: npm run pieces-land-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation-3'
        run: npm run idle-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run contrast-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
        run: npm run keyboard-place-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation'
        run: npm run upgrade-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'presentation'
        run: npm run flash-prove
      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-a'
