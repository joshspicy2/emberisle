      - if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'flows-c'
        run: npm run install-prove
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-b-${{ matrix.suite }}-test-results
          path: test-results/
          if-no-files-found: ignore

  # always() so a failed or cancelled job above fails this check instead of skipping it (a skipped required check passes).
  # A draft skips it (grey): GitHub never merges a draft, and marking it ready starts a fresh run on the same head SHA,
  # whose checks must each pass. Every other run keeps always() and the explicit tests below.
  checks:
    needs: [changes, build, server, browser-a, browser-b]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo 'build=${{ needs.build.result }} server=${{ needs.server.result }} browser-a=${{ needs.browser-a.result }} browser-b=${{ needs.browser-b.result }}'
          test '${{ needs.build.result }}' = success
          test '${{ needs.server.result }}' = success
          test '${{ needs.browser-a.result }}' = success
          test '${{ needs.browser-b.result }}' = success
